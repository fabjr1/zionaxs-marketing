vizinhanca_editorial:
  peca: zx-38-o-cliente-que-pergunta (06/09/2026)
  nota: >
    A zx-38 citou o custo da interrupção de passagem, como argumento para
    mandar status antes de o cliente perguntar, e apoiou-se em Gloria Mark,
    Victor M. Gonzalez e Justin Harris, No Task Left Behind?, CHI 2005. A zx-43
    não repete aquela peça: lá o assunto é comunicação com o cliente e a
    interrupção é consequência; aqui o assunto é o custo da troca dentro da
    própria casa, com fontes diferentes, com o dado contraintuitivo de a tarefa
    interrompida terminar em menos tempo e com o método de janelas de atenção.
    A proposta na Inbox da Memory recomenda que quem promover funda as 2 linhas
    de repertório em 1 só, com as 3 fontes, e mantenha as 2 linhas de matriz
    separadas.
