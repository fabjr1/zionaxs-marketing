vizinhanca_editorial:
  peca: zx-26-o-erro-que-volta (31/08/2026)
  nota: >
    A zx-26 defendeu trocar o pedido de atenção pelo desenho da tarefa, com
    Shigeo Shingo e o poka-yoke. A zx-44 divide com ela a família de ideia "não
    confie na disposição da pessoa no momento", e não repete a peça: lá o assunto
    é erro de execução em tarefa repetida, e a saída é o dispositivo acoplado à
    tarefa; aqui o assunto é uma decisão que acontece poucas vezes por ano, a
    evidência é de validade de previsão e não de qualidade de processo, e a saída
    é um roteiro comparável entre candidatos. A zx-26 inclusive deixa a
    conferência e a conversa como resíduo, que é onde esta peça entra.
